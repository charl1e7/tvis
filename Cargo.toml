[workspace]
resolver = "3"
members = ["crates/tvis-core", "crates/tvis"]
default-members = ["crates/tvis"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
authors = ["charl1e7"]
license = "MIT"
repository = "https://github.com/charl1e7/tvis"
homepage = "https://github.com/charl1e7/tvis"
readme = "README.md"
keywords = ["process", "monitor", "profiler", "metrics", "gui"]
categories = ["development-tools::profiling", "visualization"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
